<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Generador de QR</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="topbar">
    <h1>Generador de QR</h1>
    <button id="themeToggle" class="icon-btn" aria-label="Cambiar tema">🌙</button>
  </header>

  <main class="container">
    <section class="card">
      <label for="inputText">Texto o URL</label>
      <textarea id="inputText" rows="3" placeholder="https://ejemplo.com o cualquier texto"></textarea>

      <div class="actions">
        <button id="generateBtn" class="btn primary">Generar QR</button>
        <button id="clearBtn" class="btn ghost">Limpiar</button>
      </div>

      <div id="error" class="error" role="alert" hidden></div>
    </section>

    <section class="card result">
      <div id="qr" class="qr-box" aria-live="polite"></div>
      <div class="actions">
        <button id="downloadBtn" class="btn" disabled>Descargar PNG</button>
        <button id="copyBtn" class="btn" disabled>Copiar imagen</button>
      </div>
    </section>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
