<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Generador de QR</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="topbar">
    <h1>Generador de QR</h1>
    <button id="themeToggle" class="icon-btn" aria-label="Cambiar tema">🌙</button>
  </header>

  <main class="container">
    <section class="card">
      <label for="inputText">Texto o URL</label>
      <textarea id="inputText" rows="3" placeholder="https://ejemplo.com o cualquier texto" autofocus></textarea>

      <div class="options">
        <div>
          <label for="levelSelect">Corrección de errores</label>
          <select id="levelSelect">
            <option value="L">L · 7 %</option>
            <option value="M" selected>M · 15 %</option>
            <option value="Q">Q · 25 %</option>
            <option value="H">H · 30 %</option>
          </select>
        </div>
        <div>
          <label for="sizeSelect">Tamaño de descarga</label>
          <select id="sizeSelect">
            <option value="256">256 px</option>
            <option value="512" selected>512 px</option>
            <option value="1024">1024 px</option>
          </select>
        </div>
      </div>

      <div class="actions">
        <button id="clearBtn" class="btn ghost">Limpiar</button>
      </div>

      <div id="error" class="error" role="alert" hidden></div>
    </section>

    <section class="card result">
      <div class="qr-box" aria-live="polite">
        <canvas id="qrCanvas" width="256" height="256" hidden></canvas>
        <p id="placeholder" class="muted">El QR aparecerá aquí.</p>
      </div>
      <div class="actions">
        <button id="downloadPngBtn" class="btn" disabled>Descargar PNG</button>
        <button id="downloadSvgBtn" class="btn" disabled>Descargar SVG</button>
        <button id="copyBtn" class="btn" disabled>Copiar imagen</button>
      </div>
    </section>
  </main>

  <script src="js/vendor/qrcode.js"></script>
  <script src="js/qr-core.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
